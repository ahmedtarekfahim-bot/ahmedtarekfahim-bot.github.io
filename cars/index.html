<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>سيارات طارق</title>
<meta name="description" content="سيارات طارق - لعبة سباق سيارات أونلاين في ليلة رعب، فيها فراخ وزفة!">
<meta property="og:title" content="سيارات طارق 🏎️👻">
<meta property="og:description" content="لعبة سباق سيارات أونلاين، العب على طول من المتصفح">
<meta name="theme-color" content="#07040f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🏎️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040f;--card:rgba(14,8,26,.88);--line:rgba(255,255,255,.14);--txt:#fff;--mut:#c2b8d8;--acc:#ffb000}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:Cairo,Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(5,2,12,.4),rgba(5,2,12,.82));z-index:20;overflow:auto}
.card{width:100%;max-width:470px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;text-align:center;backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(255,90,0,.12);margin:auto}
h1{font-size:clamp(34px,9vw,52px);font-weight:900;line-height:1.15;background:linear-gradient(180deg,#fff36b,#ff8a00 55%,#d1001c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4a0010) drop-shadow(0 0 18px rgba(255,80,0,.35))}
.sub{color:var(--mut);font-size:14px;margin:4px 0 10px;line-height:1.7}
.lbl{font-size:14px;color:var(--mut);margin:10px 0 7px;font-weight:800}
.sw{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.sw button.on{border-color:#fff;transform:scale(1.12)}
.seg{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;max-width:120px;padding:7px 0;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--txt);font:800 15px Cairo,sans-serif;cursor:pointer}
.seg button.on{background:var(--acc);color:#222;border-color:var(--acc)}
.go{margin-top:16px;width:100%;padding:13px;border:0;border-radius:16px;background:linear-gradient(180deg,#ff7a1a,#d43a00);color:#fff;font:900 22px Cairo,sans-serif;cursor:pointer;box-shadow:0 6px 0 #7a1f00,0 10px 24px rgba(255,90,0,.35)}
.go:active{transform:translateY(3px);box-shadow:0 3px 0 #7a1f00}
.go.alt{background:linear-gradient(180deg,#4b3a78,#2d2152);box-shadow:0 6px 0 #18102e;font-size:18px;margin-top:12px}
.help{margin-top:12px;font-size:13px;color:var(--mut);line-height:1.9}
.help kbd{display:inline-block;min-width:26px;padding:0 6px;border-radius:6px;background:#fff;color:#111;font-weight:900;box-shadow:0 2px 0 #999;margin:0 2px}
.best{margin-top:8px;font-size:14px;color:var(--acc);font-weight:800}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10;pointer-events:none}
.box{background:rgba(10,5,20,.72);border:1px solid var(--line);border-radius:12px;padding:3px 12px;text-align:center;min-width:70px}
.box small{display:block;font-size:11px;color:var(--mut);font-weight:800}
.box b{font-size:20px;font-weight:900;direction:ltr;display:block;line-height:1.25}
#speedo{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 58px);left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;text-align:center;text-shadow:0 2px 6px #000}
#speedo b{font-size:38px;font-weight:900;font-style:italic;color:#fff;line-height:1}
#speedo small{display:block;font-size:12px;color:#ddd;font-weight:800}
.topbtn{position:fixed;top:max(10px,env(safe-area-inset-top));z-index:15;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(10,5,20,.72);color:#fff;font-size:20px;cursor:pointer}
#pauseBtn{left:12px}#muteBtn{right:12px}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(30vw,180px);font-weight:900;color:#fff;text-shadow:0 6px 0 #9a0018,0 0 40px rgba(255,60,0,.7);z-index:12;pointer-events:none}
#banner{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:clamp(26px,7vw,46px);font-weight:900;color:var(--acc);text-shadow:0 4px 0 #4a1a00,0 8px 30px rgba(0,0,0,.7);z-index:11;pointer-events:none;transition:opacity .4s}
#touch{position:fixed;left:0;right:0;bottom:0;height:46%;z-index:9;pointer-events:none}
#touch .grp{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));display:flex;gap:12px;direction:ltr;pointer-events:auto}
#touch .l{left:14px}#touch .r{right:14px}
#touch button{width:min(21vw,96px);height:min(21vw,96px);border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(20,10,40,.5);color:#fff;font:900 30px Cairo,sans-serif;touch-action:none}
#touch button.gas{background:rgba(30,170,60,.55);font-size:18px;height:min(28vw,124px);border-radius:26px}
#touch button.brk{background:rgba(210,40,40,.5);font-size:18px;border-radius:26px}
#touch button.on{transform:scale(.93);background:rgba(255,255,255,.35)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
td{padding:4px 8px;border-bottom:1px solid var(--line)}
tr.me td{color:var(--acc);font-weight:900}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-left:6px}
.big{font-size:clamp(28px,8vw,40px);font-weight:900;margin:6px 0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="box"><small>المركز</small><b id="hPos">12/12</b></div>
  <div class="box"><small>اللفة</small><b id="hLap">1/3</b></div>
  <div class="box"><small>الوقت</small><b id="hTime">0:00.0</b></div>
</div>
<div id="speedo" class="hidden"><b id="hSpd">0</b><small>كم/س</small></div>
<div id="count" class="hidden"></div>
<div id="banner" style="opacity:0"></div>
<button id="pauseBtn" class="topbtn hidden" aria-label="إيقاف مؤقت">⏸</button>
<button id="muteBtn" class="topbtn" aria-label="الصوت">🔊</button>

<div id="touch" class="hidden">
  <div class="grp l"><button data-k="left" aria-label="شمال">◀</button><button data-k="right" aria-label="يمين">▶</button></div>
  <div class="grp r"><button data-k="down" class="brk">فرامل</button><button data-k="up" class="gas">بنزين</button></div>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>سيارات طارق 🏎️</h1>
    <p class="sub">ليلة رعب 👻 سباق ٣ لفات ضد ١١ عربية<br>وخلي بالك من الفراخ والكتاكيت 🐔🐥 واستمتع بالزفة 💃🥁</p>
    <div class="lbl">إنت مين؟</div>
    <div class="seg" id="who"></div>
    <div class="lbl">لون عربيتك</div>
    <div class="sw" id="colors"></div>
    <div class="lbl">الصعوبة</div>
    <div class="seg" id="diff">
      <button data-d="0">سهل</button><button data-d="1" class="on">عادي</button><button data-d="2">صعب</button>
    </div>
    <button class="go" id="startBtn">ابدأ السباق 🏁</button>
    <div class="best" id="bestTxt"></div>
    <div class="help" id="helpKeys">
      <kbd>↑</kbd> بنزين &nbsp; <kbd>↓</kbd> فرامل &nbsp; <kbd>←</kbd><kbd>→</kbd> شمال ويمين &nbsp; <kbd>P</kbd> إيقاف
    </div>
    <div class="help hidden" id="helpTouch">بنزين وفرامل على اليمين، والاتجاهات على الشمال</div>
  </div>
</div>

<div id="pauseOv" class="overlay hidden">
  <div class="card">
    <div class="big">⏸ استراحة</div>
    <button class="go" id="resumeBtn">كمّل السباق</button>
    <button class="go alt" id="quitBtn">القائمة الرئيسية</button>
  </div>
</div>

<div id="result" class="overlay hidden">
  <div class="card">
    <div class="big" id="rTitle"></div>
    <div class="sub" id="rSub"></div>
    <table id="rTable"></table>
    <button class="go" id="againBtn">العب تاني 🔁</button>
    <button class="go alt" id="menuBtn">القائمة الرئيسية</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'), ctx=cv.getContext('2d');
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- constants ----------
const STEP=1/60, SEG=200, ROAD=2000, LANES=3, RUMBLE=3, FOV=100, CAM_H=1000;
const CAM_D=1/Math.tan((FOV/2)*Math.PI/180), PLAYER_Z=CAM_H*CAM_D;
const MAXS=SEG/STEP, ACCEL=MAXS/5, BRAKE=-MAXS, DECEL=-MAXS/5, OFF_DECEL=-MAXS/2, OFF_LIMIT=MAXS/4, CENTRI=0.3;
const CAR_W=460, CAR_WO=CAR_W/ROAD, LAPS=3, N_AI=11, N_TRAFFIC=6, ROWS=Math.ceil((N_AI+1)/2);
const DRAW=isTouch?160:240;
const COLORS=['#e8202a','#1e6fff','#ffcc00','#19b34a','#ff7a00','#9b3cff','#f5f5f5','#ff4fa3','#00c2c7','#8b5a2b'];
const FAMILY=['طارق','عز','ياسمين','أحمد','منى'];
const OTHERS=['سالم','فهد','نورة','خالد','مريم','يوسف','سارة'];
const ORD=['الأول','التاني','التالت','الرابع','الخامس','السادس','السابع','التامن','التاسع','العاشر','الحادي عشر','التاني عشر'];
const DIFF=[[0.68,0.84],[0.78,0.93],[0.87,0.985]];

let W,H,KX,KY,HZ,T=0;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,isTouch?1.5:2);
  W=cv.width=Math.floor(innerWidth*dpr); H=cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  const portrait=H>W;
  const padB=isTouch?H*(portrait?0.2:0.08):0;
  HZ=portrait?H*0.4:H*0.5;
  KX=Math.min(W/2,H*0.72); KY=H-padB-HZ;
}
addEventListener('resize',resize); resize();

// ---------- utils ----------
const U={
  inc(s,i,m){let r=s+i;while(r>=m)r-=m;while(r<0)r+=m;return r},
  acc(v,a,dt){return v+a*dt},
  lim(v,a,b){return Math.max(a,Math.min(v,b))},
  interp(a,b,p){return a+(b-a)*p},
  easeIn(a,b,p){return a+(b-a)*p*p},
  easeInOut(a,b,p){return a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5)},
  pct(n,t){return (n%t)/t},
  overlap(x1,w1,x2,w2,p){const h=(p||1)/2;return !((x1+w1*h)<(x2-w2*h)||(x1-w1*h)>(x2+w2*h))}
};
let seed=7;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const shadeCache={};
function shade(hex,a){
  const k=hex+a; if(shadeCache[k])return shadeCache[k];
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=a<0?0:255, p=Math.abs(a);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return shadeCache[k]='rgb('+r+','+g+','+b+')';
}
function poly(x1,y1,x2,y2,x3,y3,x4,y4,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,Math.max(0,Math.min(r,w/2,h/2)));else ctx.rect(x,y,w,h);ctx.fill()}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,Math.max(0.5,r),0,7);ctx.fill()}
function glow(x,y,r,col,a){
  const g=ctx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,col.replace('A',a)); g.addColorStop(1,col.replace('A',0));
  ctx.fillStyle=g; ctx.fillRect(x-r,y-r,r*2,r*2);
}

// ---------- track ----------
let segs=[], trackLen=0, startIdx=0, wedS=0, wedE=0, flocks=[];
const startZ=PLAYER_Z+(ROWS-1)*600+400;
function lastY(){return segs.length?segs[segs.length-1].p2.world.y:0}
function addSeg(curve,y){
  const n=segs.length;
  segs.push({i:n,curve,sprites:[],cars:[],dark:Math.floor(n/RUMBLE)%2,
    p1:{world:{x:0,y:lastY(),z:n*SEG},camera:{},screen:{}},
    p2:{world:{x:0,y:y,z:(n+1)*SEG},camera:{},screen:{}}});
}
function addRoad(e,h,l,curve,y){
  const sy=lastY(), ey=sy+(y||0)*SEG, t=e+h+l;
  for(let n=0;n<e;n++)addSeg(U.easeIn(0,curve,n/e),U.easeInOut(sy,ey,n/t));
  for(let n=0;n<h;n++)addSeg(curve,U.easeInOut(sy,ey,(e+n)/t));
  for(let n=0;n<l;n++)addSeg(U.easeInOut(curve,0,n/l),U.easeInOut(sy,ey,(e+h+n)/t));
}
const SPR={
  palm:{w:950,h:2000}, deadtree:{w:1100,h:1600}, tomb:{w:400,h:470}, pumpkin:{w:420,h:340},
  ghost:{w:560,h:740,soft:1}, eyes:{w:780,h:430}, lamp:{w:260,h:2300}, board:{w:1700,h:1150},
  rock:{w:650,h:380}, dancer:{w:330,h:740}, drummer:{w:400,h:740}
};
const BOARDS=[['ليلة رعب 👻','#6b0f1a'],['سيارات طارق','#3b1366'],['احذر الفراخ 🐔','#8a5300'],['ممنوع الخوف 😱','#0f3d5a'],['الزفة قدّام 💃','#a0105a']];
function buildTrack(){
  segs=[]; flocks=[]; seed=7;
  addRoad(30,30,30,0,0);
  addRoad(25,25,25,0,0);
  addRoad(50,50,50,4,0);
  addRoad(50,50,50,0,40);
  addRoad(50,50,50,-4,-20);
  addRoad(40,40,40,-2,0); addRoad(40,40,40,4,20); addRoad(40,40,40,2,-20); addRoad(40,40,40,-2,0);
  addRoad(25,25,25,0,10); addRoad(25,25,25,0,-10); addRoad(25,25,25,0,10); addRoad(25,25,25,0,-10);
  addRoad(50,50,50,6,30);
  addRoad(80,50,80,-3,-40);
  wedS=segs.length+15; addRoad(30,170,30,0,0); wedE=segs.length-15;
  addRoad(50,90,50,-6,0);
  addRoad(25,25,25,0,20); addRoad(25,25,25,0,-20);
  addRoad(50,50,50,3,10);
  addRoad(100,100,100,0,-lastY()/SEG);
  addRoad(40,40,40,0,0);
  trackLen=segs.length*SEG;
  startIdx=Math.floor(startZ/SEG);
  segs[startIdx].start=1; segs[startIdx+1].start=1; segs[startIdx].gantry=1;
  // wedding zone
  for(let n=wedS;n<=wedE;n++){
    segs[n].wed=1;
    if((n-wedS)%8===4)segs[n].rope=1;
    if((n-wedS)%2===0){
      for(const side of [-1,1]){
        const t=rnd()<0.3?'drummer':'dancer';
        segs[n].sprites.push({type:t,offset:side*(1.15+rnd()*0.6),ph:rnd()*6,male:rnd()<0.5,c:['#ff4fa3','#ffd400','#9b3cff','#19b3a0','#ff7a00','#e8202a'][Math.floor(rnd()*6)]});
      }
    }
  }
  segs[wedS].gate=1; segs[wedE].gate=1;
  // scary scenery
  for(let n=6;n<segs.length;n+=3){
    if(segs[n].wed)continue;
    const side=rnd()<0.5?-1:1, r=rnd();
    const type=r<0.26?'deadtree':r<0.42?'tomb':r<0.55?'pumpkin':r<0.65?'ghost':r<0.77?'eyes':r<0.9?'palm':'rock';
    segs[n].sprites.push({type,offset:side*(1.25+rnd()*2.2),ph:rnd()*6});
    if(rnd()<0.35){const t2=['tomb','deadtree','pumpkin','eyes'][Math.floor(rnd()*4)];segs[n].sprites.push({type:t2,offset:-side*(1.3+rnd()*2.4),ph:rnd()*6})}
  }
  for(let n=20;n<segs.length;n+=24){ if(segs[n].wed)continue; segs[n].sprites.push({type:'lamp',offset:-1.12,ph:rnd()*6}); segs[n].sprites.push({type:'lamp',offset:1.12,ph:rnd()*6}); }
  let b=0;
  for(let n=60;n<segs.length;n+=170){ if(segs[n].wed)continue; const B=BOARDS[b++%BOARDS.length]; segs[n].sprites.push({type:'board',offset:(b%2?1:-1)*1.3,text:B[0],col:B[1]}); }
  // chickens & chicks crossing the street
  for(let n=startIdx+60;n<segs.length-30;n+=60+Math.floor(rnd()*40)){
    if(n>=wedS-20&&n<=wedE+20)continue;
    const dir=rnd()<0.5?1:-1, members=[{kind:'hen',lag:0,ph:rnd()*6,hit:0}];
    const nc=2+Math.floor(rnd()*4);
    for(let k=0;k<nc;k++)members.push({kind:'chick',lag:0.15+k*0.11,ph:rnd()*6,hit:0});
    if(rnd()<0.3)members.push({kind:'hen',lag:0.15+nc*0.11+0.08,ph:rnd()*6,hit:0});
    const g={n,offset:(rnd()*3.4-1.7),dir,speed:0.32+rnd()*0.3,wait:0,members};
    segs[n].flock=g; flocks.push(g);
  }
}
function findSeg(z){return segs[Math.floor(z/SEG)%segs.length]}

// ---------- state ----------
let state='menu', position=0, speed=0, playerX=0, pDist=0, raceTime=0, countT=0, bgOff=0, shake=0;
let cars=[], playerColor=store.get('st_color',COLORS[0]), diff=store.get('st_diff',1), myName=store.get('st_name','طارق');
if(FAMILY.indexOf(myName)<0)myName='طارق';
let lapShown=1, finishInfo=null, doneT=0, wedGlow=0, zaffa=0, playerBy=0, bride=null;
let flash=0, lightT=6, bolt=null, howlT=14, drumT=0, drumK=0, zagT=2, fwT=0, clucked=0;
const skyFx=[], topFx=[];
const keys={up:false,down:false,left:false,right:false};
const stars=[];for(let i=0;i<140;i++)stars.push({x:Math.random(),y:Math.random()*0.9,r:Math.random()*1.4+0.4,p:Math.random()*6});

function resetRace(demo){
  position=0; speed=0; playerX=0.5; pDist=PLAYER_Z; raceTime=0; bgOff=0; lapShown=1; finishInfo=null;
  segs.forEach(s=>s.cars.length=0);
  flocks.forEach(g=>g.members.forEach(m=>m.hit=0));
  cars=[]; skyFx.length=0; topFx.length=0;
  const [lo,hi]=DIFF[diff];
  const pal=COLORS.filter(c=>c!==playerColor);
  const names=FAMILY.filter(n=>n!==myName).concat(OTHERS);
  const frontZ=PLAYER_Z+(ROWS-1)*600;
  const tops=[];for(let i=0;i<N_AI;i++)tops.push(lo+(hi-lo)*(i/(N_AI-1)));
  tops.sort(()=>Math.random()-0.5);
  for(let i=0;i<N_AI;i++){
    const row=Math.floor(i/2), z=frontZ-row*600, ln=i%2?0.5:-0.5;
    const c={z,dist:z,offset:ln,lane:ln,speed:0,top:MAXS*tops[i],color:pal[i%pal.length],name:names[i],finished:false,ft:0};
    cars.push(c); findSeg(z).cars.push(c);
  }
  const N=segs.length;

    cars.push(c); findSeg(z).cars.push(c);
  }

// ---------- update ----------
function steerCar(car,cs,ps){
  for(let i=1;i<20;i++){
    const seg=segs[(cs.i+i)%segs.length];
    if(seg===ps && car.speed>speed && U.overlap(playerX,CAR_WO,car.offset,CAR_WO,1.3)){
      const dir=playerX>0.5?-1:playerX<-0.5?1:(car.offset>playerX?1:-1);
      return dir*(1/i)*(car.speed-speed)/MAXS;
    }
    for(const o of seg.cars){
      if(o!==car && car.speed>o.speed && U.overlap(car.offset,CAR_WO,o.offset,CAR_WO,1.3)){
        const dir=o.offset>0.5?-1:o.offset<-0.5?1:(car.offset>o.offset?1:-1);
        return dir*(1/i)*(car.speed-o.speed)/MAXS;
      }
    }
  }
  return (car.lane-car.offset)*0.004;
}
function updateCars(dt,ps,aiOn){
  const pz=U.inc(position,PLAYER_Z,trackLen);
  for(const car of cars){
    const os=findSeg(car.z);
    let target=0;
    if(aiOn){
      if(car.traffic) target=car.top;
      else{
        target=car.top*(1-Math.min(0.22,Math.abs(os.curve)*0.035));
        const gap=car.dist-pDist;
        if(state==='race'){ if(gap<-5000)target*=1.06; else if(gap>25000)target*=0.94; }
        target=Math.min(target,MAXS*0.99);
      }
    }
    if(car.speed<target)car.speed=Math.min(target,car.speed+ACCEL*0.85*dt);
    else car.speed=Math.max(target,car.speed+DECEL*dt);
    if(os===ps && car.speed>speed && car.z<pz && U.overlap(playerX,CAR_WO,car.offset,CAR_WO,0.9)) car.speed=speed*0.95;
    if(!car.bride){
      const st=U.lim(steerCar(car,os,ps)*dt*60,-0.05,0.05);
      car.offset=U.lim(car.offset+st,-0.85,0.85);
    }
    car.z=U.inc(car.z,dt*car.speed,trackLen); car.dist+=dt*car.speed;
    const ns=findSeg(car.z);
    if(ns!==os){const k=os.cars.indexOf(car);if(k>=0)os.cars.splice(k,1);ns.cars.push(car)}
    if(!car.traffic && !car.finished && car.dist-startZ>=LAPS*trackLen){car.finished=true;car.ft=raceTime}
  }
}
function memberAlive(m){return !m.hit||T-m.hit>25}
function updateFlocks(dt){
  for(const g of flocks){
    if(g.wait>0){g.wait-=dt;continue}
    g.offset+=g.dir*g.speed*dt;
    if((g.dir>0&&g.offset>2.1)||(g.dir<0&&g.offset<-2.1)){g.dir=-g.dir;g.wait=0.8+Math.random()*2.5}
  }
}
function hitChicken(m){

  const n=m.kind==='hen'?22:12, col=m.kind==='hen'?['#ffffff','#f1ece0','#e0201c']:['#ffe14a','#ffd000','#fff3a0'];

function update(dt){
  const ps=findSeg(position+PLAYER_Z), sp=speed/MAXS, dx=dt*1.7*sp, start=position;
  const control=state==='race';
  updateCars(dt,ps,state==='race'||state==='done'||state==='menu');
  updateFlocks(dt);
  position=U.inc(position,dt*speed,trackLen);
  if(control){
    if(keys.left)playerX-=dx; else if(keys.right)playerX+=dx;
    if(keys.up)speed=U.acc(speed,ACCEL,dt); else if(keys.down)speed=U.acc(speed,BRAKE,dt); else speed=U.acc(speed,DECEL,dt);
  }else{
    const want=state==='menu'?0.6:0.5;
    speed=speed<MAXS*want?U.acc(speed,ACCEL,dt):U.acc(speed,DECEL,dt);
    playerX+=(0-playerX)*0.04+dx*sp*ps.curve*CENTRI;
  }
  playerX-=dx*sp*ps.curve*CENTRI;
  if(playerX<-1||playerX>1){
    if(speed>OFF_LIMIT)speed=U.acc(speed,OFF_DECEL,dt);
    for(const s of ps.sprites){
      const d=SPR[s.type]; if(d.soft)continue;
      const sw=d.w/ROAD, cx=s.offset+(s.offset>0?1:-1)*sw/2;
      if(U.overlap(playerX,CAR_WO,cx,sw*0.55)){
        if(speed>MAXS/4){sfxCrash();shake=0.35}
        speed=MAXS/5; position=U.inc(ps.p1.world.z,-PLAYER_Z,trackLen); break;
      }
    }
  }
  if(state!=='menu'){
    for(const sg of [ps,segs[(ps.i+1)%segs.length]]){
      const g=sg.flock; if(!g)continue;
      for(const m of g.members){
        if(!memberAlive(m))continue;
        const off=g.offset-g.dir*m.lag, mw=(m.kind==='hen'?300:160)/ROAD;
        if(U.overlap(playerX,CAR_WO,off,mw,0.9))hitChicken(m);
      }
    }
  }
  for(const car of ps.cars){
    if(speed>car.speed && U.overlap(playerX,CAR_WO,car.offset,CAR_WO,0.8)){
      if(speed-car.speed>MAXS*0.08){sfxBump();shake=0.2}
      speed=car.speed*(car.speed/speed); position=U.inc(car.z,-PLAYER_Z,trackLen); break;
    }
  }
  playerX=U.lim(playerX,-3,3); speed=U.lim(speed,0,MAXS);
  let d=position-start; if(d<-trackLen/2)d+=trackLen; else if(d>trackLen/2)d-=trackLen;
  pDist+=d; bgOff+=ps.curve*d/SEG;
  if(shake>0)shake-=dt;
  // wedding / zaffa proximity
  wedGlow+=((ps.wed?1:0)-wedGlow)*Math.min(1,dt*2);
  let bd=bride?bride.z-U.inc(position,PLAYER_Z,trackLen):1e9; if(bd<-trackLen/2)bd+=trackLen; else if(bd>trackLen/2)bd-=trackLen;
  const bn=U.lim(1-Math.abs(bd)/(45*SEG),0,1);
  zaffa=Math.max(wedGlow,bn);
}
function updateFx(dt){

function project(p,cx,cy,cz){
  p.camera.x=p.world.x-cx; p.camera.y=p.world.y-cy; p.camera.z=p.world.z-cz;
  const s=p.screen.scale=CAM_D/p.camera.z;

  p.screen.y=Math.round(HZ-s*p.camera.y*KY);

}

function hills(base,off,amp,col,freq,seedK){

  ctx.globalAlpha=1;
  let maxy=H, x=0, dx=-(base.curve*bp);
  const N=segs.length;
  for(let n=0;n<DRAW;n++){
    const seg=segs[(base.i+n)%N];
    seg.looped=seg.i<base.i; seg.clip=maxy;
    const cz=position-(seg.looped?trackLen:0);
    project(seg.p1,playerX*ROAD-x,pY+CAM_H,cz);
    project(seg.p2,playerX*ROAD-x-dx,pY+CAM_H,cz);
    x+=dx; dx+=seg.curve;
    if(seg.p1.camera.z<=CAM_D||seg.p2.screen.y>=seg.p1.screen.y||seg.p2.screen.y>=maxy)continue;
    drawSegment(seg,n);
    maxy=seg.p1.screen.y;
  }
  for(let n=DRAW-1;n>0;n--){
    const seg=segs[(base.i+n)%N];
    if(seg.p1.camera.z>CAM_D){
      const fa=fogA(n);
      ctx.globalAlpha=Math.max(0.05,fa);
      for(const s of seg.sprites){
        const sc=seg.p1.screen.scale;
        drawSprite(s,sc,seg.p1.screen.x+sc*s.offset*ROAD*KX,seg.p1.screen.y,seg.clip);
      }
      if(seg.gantry)drawGantry(seg,seg.clip,'start');
      if(seg.gate)drawGantry(seg,seg.clip,'wed');
      if(seg.rope)drawRope(seg,seg.clip);
      if(seg.flock)drawFlock(seg);
      ctx.globalAlpha=Math.max(0.45,fa);
      for(const car of seg.cars){
        const cp=U.pct(car.z,SEG);
        const sc=U.interp(seg.p1.screen.scale,seg.p2.screen.scale,cp);
        const cx=U.interp(seg.p1.screen.x,seg.p2.screen.x,cp)+sc*car.offset*ROAD*KX;
        const cy=U.interp(seg.p1.screen.y,seg.p2.screen.y,cp);
        const w=CAR_W*sc*KX;
        if(cy-w*0.8>=seg.clip||w<1)continue;
        const cl=cy>seg.clip;
        if(cl){ctx.save();ctx.beginPath();ctx.rect(0,0,W,seg.clip);ctx.clip()}
        if(car.bride)drawBride(car,cx,cy,w,sc);
        else drawCar(cx,cy,w,car.color,car.speed<car.top*0.6&&car.speed>0,0,false,state!=='menu'&&!car.traffic?car.name:null);
        if(cl)ctx.restore();
      }
      ctx.globalAlpha=1;
    }
    if(seg===ps){
      const sc=CAM_D/PLAYER_Z, w=CAR_W*sc*KX, sp=speed/MAXS;
      const off=playerX<-1||playerX>1;
      const bounce=(Math.random()-0.5)*sp*KX*(off?0.02:0.004);
      const by=HZ-sc*U.interp(ps.p1.camera.y,ps.p2.camera.y,pp)*KY-H*0.025+bounce;
      playerBy=by;
      // headlights
      ctx.save(); ctx.globalCompositeOperation='lighter';
      const hy=HZ+(by-HZ)*0.3, lg=ctx.createLinearGradient(0,by-w*0.3,0,hy);
      lg.addColorStop(0,'rgba(255,235,170,.22)'); lg.addColorStop(1,'rgba(255,235,170,0)');
      poly(W/2-w*0.42,by-w*0.3,W/2+w*0.42,by-w*0.3,W/2+w*1.5,hy,W/2-w*1.5,hy,lg);
      ctx.restore();
      const turn=(state==='race'?(keys.left?-1:keys.right?1:0):0)*(sp>0?1:0);
      drawCar(W/2+turn*w*0.02,by,w,playerColor,state==='race'&&keys.down,turn,true,null,myName);
    }
  }
  // darkness vignette (lighter at the wedding)
  const vy=HZ+(H-HZ)*0.45, vg=ctx.createRadialGradient(W/2,vy,KX*0.3,W/2,vy,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,10,0)'); vg.addColorStop(1,'rgba(0,0,10,'+(0.78-0.45*wedGlow)+')');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  if(wedGlow>0.02){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,90,170,'+(0.07*wedGlow)+')';ctx.fillRect(0,0,W,H);ctx.restore()}
  for(const p of topFx){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max*1.5)); ctx.fillStyle=p.col;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.beginPath(); ctx.ellipse(0,0,p.s*1.8,p.s*0.6,0,0,7); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(210,220,255,'+Math.max(0,flash*0.45)+')';ctx.fillRect(0,0,W,H)}
}

// ---------- audio ----------
let AC=null,eng=null,master=null,amb=null,muted=store.get('st_mute',false);
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=muted?0:0.7; master.connect(AC.destination);
    const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o1.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=600; g.gain.value=0;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
    eng={o1,o2,f,g};
    const a1=AC.createOscillator(),a2=AC.createOscillator(),ag=AC.createGain(),lfo=AC.createOscillator(),lg=AC.createGain();
    a1.type='sine';a2.type='sine';a1.frequency.value=55;a2.frequency.value=58.3;ag.gain.value=0;
    lfo.frequency.value=0.15; lg.gain.value=0.012; lfo.connect(lg); lg.connect(ag.gain);
    a1.connect(ag);a2.connect(ag);ag.connect(master);a1.start();a2.start();lfo.start();
    amb=ag;
  }catch(e){AC=null}
}
function engineTick(){
  if(!eng)return;
  const p=speed/MAXS, t=AC.currentTime, on=state==='race'||state==='count'||state==='done';
  const fr=48+p*175+(keys.up&&on?10:0);
  eng.o1.frequency.setTargetAtTime(fr,t,0.06); eng.o2.frequency.setTargetAtTime(fr*0.501,t,0.06);
  eng.f.frequency.setTargetAtTime(350+p*1500,t,0.08);
  eng.g.gain.setTargetAtTime(on?0.045+p*0.045:0,t,0.1);
  amb.gain.setTargetAtTime(state==='menu'||state==='paused'?0:0.03*(1-zaffa),t,0.5);
}
function chirp(f1,f2,dur,type,vol,delay){
  if(!AC)return;
  const t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function tone(freq,dur,type,vol){chirp(freq,freq,dur,type,vol)}
function noise(dur,vol,cut,type){
  if(!AC)return;
  const len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=buf; f.type=type||'lowpass'; f.frequency.value=cut; g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
function sfxCrash(){noise(0.45,0.6,900);tone(70,0.3,'sine',0.3)}
function sfxBump(){noise(0.18,0.35,1600)}
function sfxThunder(){noise(2.2,0.8,220);noise(0.4,0.4,900)}
function sfxCluck(kind){
  if(kind==='hen'){chirp(950,520,0.09,'square',0.1,0);chirp(950,520,0.09,'square',0.1,0.12);chirp(1300,600,0.16,'square',0.12,0.26)}
  else{chirp(2600,3400,0.08,'sine',0.12,0);chirp(2600,3400,0.08,'sine',0.12,0.12)}
}
function sfxHowl(){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(330,t); o.frequency.linearRampToValueAtTime(640,t+0.6); o.frequency.linearRampToValueAtTime(560,t+1.6); o.frequency.linearRampToValueAtTime(380,t+2.2);
  l.frequency.value=5; lg.gain.value=10; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.09,t+0.4); g.gain.linearRampToValueAtTime(0.07,t+1.6); g.gain.linearRampToValueAtTime(0.0001,t+2.3);
  o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t+2.4); l.stop(t+2.4);
}
function sfxDum(v){chirp(130,50,0.2,'sine',0.45*v)}
function sfxTak(v){noise(0.06,0.3*v,2500,'highpass')}
function sfxPop(v){noise(0.3,0.12*v,1400)}
function sfxZag(v){
  if(!AC)return;
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(1050,t); o.frequency.linearRampToValueAtTime(1250,t+1.6);
  l.type='square'; l.frequency.value=13; lg.gain.value=140; l.connect(lg); lg.connect(o.frequency);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.07*v,t+0.15); g.gain.setValueAtTime(0.07*v,t+1.5); g.gain.linearRampToValueAtTime(0.0001,t+1.9);
  o.connect(g); g.connect(master); o.start(t); l.start(t); o.stop(t+2); l.stop(t+2);
}
function setMute(m){muted=m;store.set('st_mute',m);$('muteBtn').textContent=m?'🔇':'🔊';if(master)master.gain.value=m?0:0.7}
setMute(muted);

// ---------- UI ----------
const hud=$('hud'),speedo=$('speedo'),countEl=$('count'),banner=$('banner');
let bannerT=0;
function showBanner(t,sec){banner.textContent=t;banner.style.opacity=1;bannerT=sec||1.6}
function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)}
function racers(){return cars.filter(c=>!c.traffic)}
function rank(){let r=1;for(const c of cars)if(!c.traffic&&c.dist>pDist)r++;return r}
function lapNow(){return U.lim(Math.floor((pDist-startZ)/trackLen)+1,1,LAPS)}
let hudK=0;
function updateHud(){
  if(++hudK%3)return;
  $('hPos').textContent=rank()+'/'+(N_AI+1);
  $('hLap').textContent=lapNow()+'/'+LAPS;
  $('hTime').textContent=fmt(raceTime);
  $('hSpd').textContent=Math.round(speed/MAXS*260);
}
function bestKey(){return 'st_best_'+diff}
function refreshBest(){const b=store.get(bestKey(),0);$('bestTxt').textContent=b?('🏆 أحسن وقت ('+['سهل','عادي','صعب'][diff]+'): '+fmt(b)):''}

const cbox=$('colors');
COLORS.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','لون');if(c===playerColor)b.className='on';
  b.onclick=()=>{playerColor=c;store.set('st_color',c);[...cbox.children].forEach(x=>x.className='');b.className='on'};cbox.appendChild(b)});
const wbox=$('who');
FAMILY.forEach(n=>{const b=document.createElement('button');b.textContent=n;if(n===myName)b.className='on';
  b.onclick=()=>{myName=n;store.set('st_name',n);[...wbox.children].forEach(x=>x.className='');b.className='on'};wbox.appendChild(b)});
document.querySelectorAll('#diff button').forEach(b=>{b.className=+b.dataset.d===diff?'on':'';b.onclick=()=>{diff=+b.dataset.d;store.set('st_diff',diff);document.querySelectorAll('#diff button').forEach(x=>x.className='');b.className='on';refreshBest()}});
if(isTouch){$('helpKeys').classList.add('hidden');$('helpTouch').classList.remove('hidden')}
refreshBest();

function show(el,on){el.classList.toggle('hidden',!on)}
let lastCount=0;
function startRace(){
  initAudio();
  resetRace(false);
  state='count'; countT=2.999; lastCount=0;
  ['menu','result','pauseOv'].forEach(i=>show($(i),false));
  show(hud,true); show(speedo,true); show($('pauseBtn'),true); show($('touch'),isTouch);
  for(const k in keys)keys[k]=false;
}
function toMenu(){
  state='menu'; resetRace(true);
  ['result','pauseOv'].forEach(i=>show($(i),false)); show($('menu'),true);
  show(hud,false); show(speedo,false); show($('pauseBtn'),false); show($('touch'),false); show(countEl,false);
  refreshBest();
}
let pausedFrom=null;
function pause(){ if(state!=='race'&&state!=='count')return; pausedFrom=state; state='paused'; show($('pauseOv'),true); }
function resume(){ if(state!=='paused')return; state=pausedFrom; show($('pauseOv'),false); for(const k in keys)keys[k]=false; }
function finish(){
  state='done'; doneT=1.6;
  const pos=rank(); const t=raceTime;
  const best=store.get(bestKey(),0); const nb=!best||t<best; if(nb)store.set(bestKey(),t);
  finishInfo={pos,t,nb};
  showBanner(pos===1?'🏆 كسبت يا '+myName+'!':'🏁 خلصت السباق!',2);
  tone(660,0.15,'square',0.15); setTimeout(()=>tone(880,0.3,'square',0.15),160);
}
function showResult(){
  const {pos,t,nb}=finishInfo;
  $('rTitle').textContent=(pos===1?'🏆 ':pos<=3?'🥈 ':'🏁 ')+'المركز '+ORD[pos-1];
  $('rSub').textContent='وقتك: '+fmt(t)+(nb?' — أحسن وقت جديد! ⭐':'');
  const list=racers().map(c=>({name:c.name,color:c.color,dist:c.dist,ft:c.finished?c.ft:null}));
  list.push({name:myName+' (إنت)',color:playerColor,dist:pDist,ft:t,me:1});
  list.sort((a,b)=>b.dist-a.dist);
  $('rTable').innerHTML=list.map((r,i)=>'<tr'+(r.me?' class="me"':'')+'><td>'+(i+1)+'</td><td><span class="dot" style="background:'+r.color+'"></span>'+r.name+'</td><td style="direction:ltr;text-align:left">'+(r.ft!=null&&(r.me||r.ft<=t)?fmt(r.ft):'—')+'</td></tr>').join('');
  show($('result'),true); show($('touch'),false); show($('pauseBtn'),false);
}
$('startBtn').onclick=startRace; $('againBtn').onclick=startRace; $('menuBtn').onclick=toMenu;
$('resumeBtn').onclick=resume; $('quitBtn').onclick=toMenu; $('pauseBtn').onclick=pause;
$('muteBtn').onclick=()=>{initAudio();setMute(!muted)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

// ---------- input ----------
const KMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  const k=KMAP[e.code]; if(k){keys[k]=true;e.preventDefault()}
  if(e.code==='KeyP'||e.code==='Escape'){state==='paused'?resume():pause()}
  if((e.code==='Enter'||e.code==='Space')&&!$('menu').classList.contains('hidden'))startRace();
  else if(e.code==='Enter'&&!$('result').classList.contains('hidden'))startRace();
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k){keys[k]=false;e.preventDefault()}});
document.querySelectorAll('#touch button').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();keys[k]=true;b.classList.add('on');initAudio()};
  const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on')};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('pointerleave',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

// ---------- loop ----------
function tick(dt){
  if(state==='paused')return;
  updateFx(dt);
  if(state==='count'){
    countT-=dt;
    const c=Math.ceil(countT);
    if(c!==lastCount){
      lastCount=c;
      if(c>=1){countEl.textContent=c;show(countEl,true);tone(440,0.18,'square',0.15)}
      else{countEl.textContent='انطلق!';tone(880,0.4,'square',0.18);state='race';setTimeout(()=>{if(state!=='count')show(countEl,false)},700)}
    }
    return;
  }
  if(state==='race')raceTime+=dt;
  update(dt);
  if(state==='race'){
    const l=lapNow();
    if(l!==lapShown){lapShown=l;showBanner(l===LAPS?'اللفة الأخيرة! 🔥':'اللفة '+l);tone(700,0.2,'triangle',0.15)}
    if(pDist-startZ>=LAPS*trackLen)finish();
  }
  if(state==='done'&&doneT>0){doneT-=dt;if(doneT<=0)showResult()}
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)banner.style.opacity=0}
}
let last=performance.now(),acc=0;
function frame(now){
  const dt=Math.min(0.25,(now-last)/1000); last=now; acc+=dt; T=now/1000;
  while(acc>=STEP){acc-=STEP;tick(STEP)}
  render(); if(state!=='menu')updateHud(); engineTick();
  requestAnimationFrame(frame);
}
buildTrack(); resetRace(true);
requestAnimationFrame(frame);
})();
</script>
